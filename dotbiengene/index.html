        dna: 'GCATATAGGATACGGGGACTG',
        description: {
          vi: 'Trẻ nhỏ dần mất kỹ năng vận động, điểm đỏ cherry-red trên võng mạc và suy giảm thần kinh tiến triển. Xét nghiệm gene HEXA.',
          en: 'Young child progressively loses motor skills, develops cherry-red spot on retina and progressive neurological decline. DNA testing of the HEXA gene.'
        },
        mutationType: 'insertion', targetPos: 5, targetVal: 'ATAG',
        note: { vi: 'Mô hình thêm đoạn gây dịch khung.', en: 'Model of an insertion that causes frameshift.' }
      },
      group6: {
        disease: { vi: 'Mù màu đỏ-xanh', en: 'Red-Green Color Blindness' },
        gene: 'OPN1LW/OPN1MW',
        dna: 'TACCGGAGAGGCGTCGGCGAC',
        description: {
          vi: 'Bệnh nhân khó phân biệt màu đỏ và xanh lục từ nhỏ. Xét nghiệm gene opsin trên tế bào nón võng mạc.',
          en: 'Patient has difficulty distinguishing red and green since childhood. DNA testing of opsin genes in retinal cone cells.'
        },
        mutationType: 'deletion', targetPos: 4, targetVal: '3',
        note: { vi: 'Mô hình mất đoạn ngắn.', en: 'Model of a short deletion.' }
      },
      group7: {
        disease: { vi: 'Hội chứng Lão nhi (Progeria)', en: 'Progeria' },
        gene: 'LMNA',
        dna: 'TACCGAGTCGAGTCCCTTAAA',
        description: {
          vi: 'Trẻ em biểu hiện lão hóa rất nhanh: da mỏng, rụng tóc sớm, cứng khớp và dấu hiệu xơ vữa động mạch. Xét nghiệm gene LMNA.',
          en: 'Child shows extremely rapid aging: thin skin, early hair loss, joint stiffness and signs of atherosclerosis. DNA testing of the LMNA gene.'
        },
        mutationType: 'substitution', targetPos: 12, targetVal: 'A',
        note: { vi: 'Mô hình thay thế điểm ảnh hưởng protein màng nhân.', en: 'Model of a point substitution affecting nuclear-envelope protein.' }
      },
      group8: {
        disease: { vi: 'Alpha Thalassemia', en: 'Alpha Thalassemia' },
        gene: 'HBA (Alpha-globin)',
        dna: 'TACCACGACAGAGGACGGCTG',
        description: {
          vi: 'Bệnh nhân thiếu máu tán huyết nặng, mệt mỏi và da xanh xao. Xét nghiệm gene HBA.',
          en: 'Patient suffers severe hemolytic anemia, fatigue and pale skin. DNA testing of the HBA gene.'
        },
        mutationType: 'deletion', targetPos: 5, targetVal: '1',
        note: { vi: 'Mô hình mất 1 base gây dịch khung.', en: 'Model of a 1-base deletion causing frameshift.' }
      }
    };

    const BASE_COLORS = {
      'A': 'bg-emerald-100 text-emerald-800 border-emerald-300',
      'T': 'bg-rose-100 text-rose-800 border-rose-300',
      'G': 'bg-sky-100 text-sky-800 border-sky-300',
      'C': 'bg-amber-100 text-amber-800 border-amber-300',
      'U': 'bg-purple-100 text-purple-800 border-purple-300'
    };

    // ========== HELPERS ==========
    const transcribe = (templateDna) => {
      const map = { 'A': 'U', 'T': 'A', 'G': 'C', 'C': 'G' };
      return templateDna.toUpperCase().split('').map(b => map[b] || b).join('');
    };
    const translate = (mrna) => {
      const codons = [];
      for (let i = 0; i <= mrna.length - 3; i += 3) {
        codons.push(mrna.substring(i, i + 3));
      }
      return codons.map(c => CODON_TABLE[c] || '???');
    };
    const getCorrectDna = (scenario) => {
      const { dna, mutationType, targetPos, targetVal } = scenario;
      const p = targetPos - 1;
      if (mutationType === 'substitution') return dna.slice(0, p) + targetVal + dna.slice(p + 1);
      if (mutationType === 'deletion') return dna.slice(0, p) + dna.slice(p + parseInt(targetVal));
      if (mutationType === 'insertion') return dna.slice(0, p) + targetVal + dna.slice(p);
      return dna;
    };

    // ========== SMALL UI ==========
    const Btn = ({ children, onClick, disabled, variant = "primary", className = "", size = "md" }) => {
      const base = "inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none";
      const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-4 py-2.5 text-sm", lg: "px-5 py-3 text-base" };
      const variants = {
        primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-sm",
        success: "bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm",
        secondary: "bg-white border-2 border-slate-200 text-slate-700 hover:border-blue-400 hover:text-blue-700",
        ghost: "bg-transparent text-slate-600 hover:bg-slate-100",
        danger: "bg-red-50 text-red-700 border border-red-200 hover:bg-red-100"
      };
      return (
        <button type="button" onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    };

    const WrittenAnswer = ({ label, hint, placeholder, value, onChange, sample, minChars = 15, rows = "min-h-[80px]", t, locked, onLock }) => {
      const [showSample, setShowSample] = useState(false);
      const canCheck = value.trim().length >= minChars;
      const revealSample = () => {
        if (!locked && onLock) onLock();
        setShowSample(s => !s);
      };
      return (
        <div className="space-y-2">
          {label && <label className="font-semibold text-sm block">{label}</label>}
          {hint && <p className="text-xs text-slate-500">{hint}</p>}
          <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 leading-relaxed">{t.lockNote}</p>
          <textarea
            className={`w-full border rounded-xl p-3 text-sm ${rows} focus:outline-none ${
              locked ? "border-slate-300 bg-slate-100 text-slate-700 cursor-not-allowed" : "border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
            }`}
            placeholder={placeholder}
            value={value}
            readOnly={!!locked}
            onChange={e => { if (!locked) onChange(e.target.value); }}
          />
          {locked && <p className="text-xs text-amber-700 font-medium">{t.lockedHint}</p>}
          <div className="flex items-center justify-between flex-wrap gap-2">
            <p className="text-xs text-slate-400">{value.trim().length} {t.chars}</p>
            <Btn size="sm" variant="secondary" disabled={!canCheck && !locked} onClick={revealSample}>
              <Icon name="check-circle" className="w-4 h-4" /> {showSample ? t.hideSample : t.showSample}
            </Btn>
          </div>
          {showSample && sample && (
            <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-sm text-blue-900">
              <p className="font-semibold text-xs uppercase text-blue-600 mb-1">{t.sampleAnswer}</p>
              <p className="whitespace-pre-line leading-relaxed">{sample}</p>
            </div>
          )}
        </div>
      );
    };

    // ========== MAIN APP ==========
    function App() {
      const [lang, setLang] = useState(() => {
        try {
          const raw = localStorage.getItem("gene_lab_v2");
          if (raw) { const d = JSON.parse(raw); if (d.lang === "en" || d.lang === "vi") return d.lang; }
        } catch (e) {}
        return "vi";
      });
      const t = TRANSLATIONS[lang];

      // Pre-interface: started = false → show welcome screen
      const [started, setStarted] = useState(false);

      const [phase, setPhase] = useState(1);
      const [teamKey, setTeamKey] = useState("group1");
      const [score, setScore] = useState(0);
      const [showCodon, setShowCodon] = useState(false);
      const [showKey, setShowKey] = useState(true);

      // Hypothesis
      const [prediction, setPrediction] = useState({ type: "", effect: "" });
      const [hasPredicted, setHasPredicted] = useState(false);

      // Practice
      const [ansMrna, setAnsMrna] = useState("");
      const [ansProtein, setAnsProtein] = useState("");
      const [aaNote, setAaNote] = useState("");
      const [isChecking, setIsChecking] = useState(false);
      const [attempts, setAttempts] = useState(0);
      const [showCorrect, setShowCorrect] = useState(false);

      // Discussion
      const [notes, setNotes] = useState({ q1: "", q2: "", q3: "", q4: "" });
      const [lockedFields, setLockedFields] = useState({});
      const lockField = (id) => setLockedFields(f => (f[id] ? f : { ...f, [id]: true }));

      // Reflection
      const [reflection, setReflection] = useState("");

      const current = SCENARIOS[teamKey];
      const correctDna = getCorrectDna(current);
      const mrnaOriginal = transcribe(current.dna);
      const proteinOriginal = translate(mrnaOriginal);
      const correctMrna = transcribe(correctDna);
      const correctProteinArr = translate(correctMrna);
      const correctProteinStr = correctProteinArr.join(", ");

      const discussionSamples = {
        q1: `${current.mutationType === "substitution" ? "Đột biến thay thế" : current.mutationType === "deletion" ? "Đột biến mất đoạn" : "Đột biến thêm đoạn"}: so sánh hai trình tự cho thấy ${current.mutationType === "substitution" ? "chiều dài không đổi nhưng có nucleotide bị thay thế tại một vị trí" : current.mutationType === "deletion" ? "DNA bệnh nhân ngắn hơn do mất nucleotide" : "DNA bệnh nhân dài hơn do có nucleotide được thêm vào"}.`,
        q2: `Protein bình thường gồm ${proteinOriginal.join(", ")}; protein sau đột biến theo trình tự đúng là ${correctProteinStr}. Hậu quả phụ thuộc vào loại đột biến và vị trí thay đổi; trong mô hình này cần đối chiếu sự thay đổi codon/amino acid để xác định hậu quả.`,
        q3: `Thay đổi DNA làm thay đổi mRNA và có thể làm thay đổi trình tự amino acid. Khi cấu trúc protein thay đổi, chức năng của protein có thể bị ảnh hưởng, từ đó làm thay đổi hoạt động tế bào và góp phần tạo ra biểu hiện bệnh của ca mô phỏng.`,
        q4: `Nếu đột biến xảy ra ở vị trí khác, hậu quả có thể khác vì mỗi vị trí có vai trò khác nhau trong trình tự mã hóa. Ví dụ, một thay đổi ở vị trí không làm đổi amino acid có thể ít ảnh hưởng hơn, trong khi thay đổi tại vùng chức năng quan trọng có thể làm protein mất chức năng.`
      };

      const isMrnaCorrect = ansMrna.toUpperCase().replace(/\s/g, "") === correctMrna;
      const isProteinCorrect = ansProtein.toUpperCase().replace(/\s/g, "").replace(/,/g, "") ===
        correctProteinStr.toUpperCase().replace(/\s/g, "").replace(/,/g, "");

      // Persist
      useEffect(() => {
        if (!started) return;
        const payload = { lang, phase, teamKey, score, prediction, hasPredicted, ansMrna, ansProtein, aaNote, notes, reflection, lockedFields, attempts, started };
        localStorage.setItem("gene_lab_v2", JSON.stringify(payload));
      }, [lang, phase, teamKey, score, prediction, hasPredicted, ansMrna, ansProtein, aaNote, notes, reflection, lockedFields, attempts, started]);

      useEffect(() => {
        try {
          const raw = localStorage.getItem("gene_lab_v2");
          if (raw) {
            const d = JSON.parse(raw);
            if (d.started) setStarted(true);
            if (d.phase) setPhase(d.phase);
            if (d.teamKey) setTeamKey(d.teamKey);
            if (d.score != null) setScore(d.score);
            if (d.prediction) setPrediction(d.prediction);
            if (d.hasPredicted) setHasPredicted(d.hasPredicted);
            if (d.ansMrna) setAnsMrna(d.ansMrna);
            if (d.ansProtein) setAnsProtein(d.ansProtein);
            if (d.aaNote) setAaNote(d.aaNote);
            if (d.notes) setNotes(d.notes);
            if (d.reflection) setReflection(d.reflection);
            if (d.lockedFields) setLockedFields(d.lockedFields);
            if (d.attempts) setAttempts(d.attempts);
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        document.title = t.appTitle;
        document.documentElement.lang = lang;
      }, [lang, t]);

      const progressPct = useMemo(() => {
        const weights = { 1: 10, 2: 20, 3: 30, 4: 25, 5: 15 };
        let p = 0;
        if (phase > 1) p += weights[1];
        if (phase > 2) p += weights[2];
        else if (phase === 2 && hasPredicted) p += weights[2] * 0.8;
        if (phase > 3) p += weights[3];
        else if (phase === 3 && (isMrnaCorrect || isProteinCorrect)) p += weights[3] * 0.5;
        if (phase > 4) p += weights[4];
        else if (phase === 4 && notes.q1.length > 20) p += weights[4] * 0.4;
        if (phase >= 5) p = 100;
        return Math.min(100, Math.round(p));
      }, [phase, hasPredicted, isMrnaCorrect, isProteinCorrect, notes]);

      const phases = [
        { id: 1, label: t.phase1 },
        { id: 2, label: t.phase2 },
        { id: 3, label: t.phase3 },
        { id: 4, label: t.phase4 },
        { id: 5, label: t.phase5 }
      ];

      const renderDnaStrip = (seq, compareSeq, isMutant = false) => {
        const maxLen = Math.max(seq.length, compareSeq.length);
        const cells = [];
        for (let i = 0; i < maxLen; i++) {
          const b = seq[i] || "";
          const other = compareSeq[i] || "";
          const isDiff = b !== other;
          cells.push(
            <div key={i} className="flex flex-col items-center">
              <span className="text-[8px] text-slate-400 font-bold mb-0.5">{i + 1}</span>
              <div className={`w-7 h-9 flex items-center justify-center border-2 rounded-lg text-xs font-bold shadow-sm
                ${b ? (BASE_COLORS[b] || "bg-slate-100") : "bg-slate-200 border-dashed"}
                ${isDiff && isMutant ? "ring-2 ring-rose-500 ring-offset-1" : ""}
                ${isDiff && !isMutant ? "ring-2 ring-amber-400 ring-offset-1" : ""}
              `}>{b || "–"}</div>
            </div>
          );
        }
        return cells;
      };

      const renderLiveMrna = (input, correct) => {
        const maxLen = Math.max(input.length, correct.length);
        const cells = [];
        for (let i = 0; i < maxLen; i++) {
          const b = input[i] || "";
          const ok = b && b === correct[i];
          cells.push(
            <div key={i} className="flex flex-col items-center">
              <span className="text-[8px] text-slate-400 font-bold mb-0.5">{i + 1}</span>
              <div className={`w-7 h-9 flex items-center justify-center border-2 rounded-lg text-xs font-bold
                ${b ? (ok ? "base-match border-emerald-400" : "base-mismatch border-rose-400") : "bg-slate-100 border-slate-200"}
              `}>{b || "·"}</div>
            </div>
          );
        }
        return cells;
      };

      const goHome = () => {
        if (window.confirm(t.homeConfirm)) {
          setPhase(1);
          setHasPredicted(false);
          setPrediction({ type: "", effect: "" });
          setAnsMrna(""); setAnsProtein(""); setAaNote("");
          setIsChecking(false); setAttempts(0); setShowCorrect(false);
          setNotes({ q1: "", q2: "", q3: "", q4: "" });
          setReflection("");
          setLockedFields({});
        }
      };

      const fullReset = () => {
        if (window.confirm(t.resetConfirm)) {
          localStorage.removeItem("gene_lab_v2");
          setStarted(false);
          setPhase(1);
          setTeamKey("group1");
          setScore(0);
          setHasPredicted(false);
          setPrediction({ type: "", effect: "" });
          setAnsMrna(""); setAnsProtein(""); setAaNote("");
          setIsChecking(false); setAttempts(0); setShowCorrect(false);
          setNotes({ q1: "", q2: "", q3: "", q4: "" });
          setReflection("");
          setLockedFields({});
        }
      };

      const handleCheck = () => {
        // The same button now works as a true Show/Hide toggle.
        if (isChecking) {
          setIsChecking(false);
          setShowCorrect(false);
          return;
        }
        setIsChecking(true);
        setAttempts(a => a + 1);
        if (isMrnaCorrect && isProteinCorrect) {
          setScore(s => s + 25);
          setShowCorrect(false);
        } else if (attempts >= 2) {
          setShowCorrect(true);
        }
      };

      // ========== PRE-INTERFACE (Welcome) ==========
      if (!started) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 flex items-center justify-center p-4">
            <div className="absolute top-4 right-4 flex rounded-lg border-2 border-slate-200 overflow-hidden shadow-sm bg-white">
              <button type="button" onClick={() => setLang("vi")} className={`px-3 py-1.5 text-xs font-bold transition ${lang === "vi" ? "bg-blue-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>VN</button>
              <button type="button" onClick={() => setLang("en")} className={`px-3 py-1.5 text-xs font-bold transition ${lang === "en" ? "bg-blue-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>EN</button>
            </div>

            <div className="max-w-lg w-full bg-white rounded-3xl shadow-2xl border border-slate-200 p-8 sm:p-10 text-center fade-in">
              <div className="mx-auto w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg mb-6">
                <Icon name="dna" className="w-8 h-8" />
              </div>
              <p className="text-xs font-bold uppercase tracking-wider text-blue-600 mb-2">{t.brand}</p>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-3 leading-tight">{t.welcomeTitle}</h1>
              <p className="text-slate-500 text-sm sm:text-base mb-6 leading-relaxed">{t.welcomeSubtitle}</p>
              <p className="text-slate-600 text-sm mb-6 leading-relaxed">{t.welcomeDesc}</p>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left mb-6">
                {[t.welcomeFeature1, t.welcomeFeature2, t.welcomeFeature3, t.welcomeFeature4].map((f, i) => (
                  <div key={i} className="flex items-start gap-2 bg-slate-50 rounded-xl p-3 border border-slate-100">
                    <Icon name="check-circle" className="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" />
                    <span className="text-xs text-slate-700 font-medium">{f}</span>
                  </div>
                ))}
              </div>

              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 mb-8 text-left">
                <strong>⚠️</strong> {t.welcomeNote}
              </div>

              <Btn onClick={() => setStarted(true)} variant="primary" size="lg" className="w-full">
                {t.startApp} <Icon name="arrow-right" className="w-5 h-5" />
              </Btn>
            </div>
          </div>
        );
      }

      // ========== MAIN LAB ==========
      return (
        <div className="max-w-4xl mx-auto px-3 py-4 sm:px-5 sm:py-6">
          {/* Header */}
          <header className="mb-5">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <p className="text-xs font-bold uppercase tracking-wider text-blue-600">{t.brand}</p>
                <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 leading-tight">{t.appTitle}</h1>
              </div>
              <div className="flex items-center gap-3">
                <Btn size="sm" variant="ghost" onClick={goHome} className="border border-slate-200">
                  <Icon name="home" className="w-4 h-4" /> {t.home}
                </Btn>
                <div className="flex rounded-lg border-2 border-slate-200 overflow-hidden shadow-sm">
                  <button type="button" onClick={() => setLang("vi")} className={`px-2.5 py-1.5 text-xs font-bold transition ${lang === "vi" ? "bg-blue-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>VN</button>
                  <button type="button" onClick={() => setLang("en")} className={`px-2.5 py-1.5 text-xs font-bold transition ${lang === "en" ? "bg-blue-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>EN</button>
                </div>
              </div>
            </div>

            <div className="h-2.5 bg-slate-200 rounded-full overflow-hidden mb-3">
              <div className="h-full bg-gradient-to-r from-blue-500 to-emerald-500 progress-bar rounded-full" style={{ width: `${progressPct}%` }} />
            </div>

            <div className="flex gap-1 overflow-x-auto pb-1">
              {phases.map(p => (
                <button
                  key={p.id}
                  type="button"
                  onClick={() => { if (p.id <= phase || p.id === 1) setPhase(p.id); }}
                  className={`shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    phase === p.id ? "bg-blue-600 text-white shadow" :
                    phase > p.id ? "bg-emerald-100 text-emerald-800" : "bg-slate-100 text-slate-400"
                  }`}
                >
                  {p.id}. {p.label}
                </button>
              ))}
            </div>
          </header>

          <main className="fade-in" key={`${phase}-${lang}-${teamKey}`}>
            {/* ===== PHASE 1: SELECT CASE ===== */}
            {phase === 1 && (
              <section className="space-y-5">
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                  <h2 className="font-bold text-lg mb-2 flex items-center gap-2">
                    <Icon name="stethoscope" className="w-5 h-5 text-blue-600" /> {t.p1Title}
                  </h2>
                  <p className="text-slate-600 text-sm leading-relaxed mb-3">{t.p1Intro}</p>
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-900">
                    <strong>{t.p1Disclaimer}</strong>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                  {Object.keys(SCENARIOS).map(key => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => setTeamKey(key)}
                      className={`p-3 rounded-xl border-2 text-left transition flex flex-col gap-2 ${
                        teamKey === key ? "border-blue-500 bg-blue-50 ring-2 ring-blue-200" : "border-slate-200 hover:border-blue-300 bg-white"
                      }`}
                    >
                      <div className={`p-2 rounded-lg w-fit ${teamKey === key ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-500"}`}>
                        <Icon name="dna" className="w-5 h-5" />
                      </div>
                      <span className={`text-xs font-bold leading-tight ${teamKey === key ? "text-blue-800" : "text-slate-700"}`}>
                        {SCENARIOS[key].disease[lang]}
                      </span>
                    </button>
                  ))}
                </div>

                {teamKey && (
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
                    <h3 className="font-bold text-base">{current.disease[lang]}</h3>
                    <p className="text-sm text-slate-600"><span className="font-semibold">Gene:</span> {current.gene}</p>
                    <p className="text-sm text-slate-600 leading-relaxed">{current.description[lang]}</p>
                    <p className="text-xs text-slate-500 italic">{current.note[lang]}</p>
                    <div className="flex justify-end pt-2">
                      <Btn onClick={() => { setPhase(2); setHasPredicted(false); setPrediction({ type: "", effect: "" }); }} variant="primary" size="lg">
                        {t.p1Start} <Icon name="arrow-right" className="w-4 h-4" />
                      </Btn>
                    </div>
                  </div>
                )}
              </section>
            )}

            {/* ===== PHASE 2: OBSERVE + HYPOTHESIS ===== */}
            {phase === 2 && (
              <section className="space-y-5">
                <h2 className="font-bold text-lg flex items-center gap-2">
                  <Icon name="eye" className="w-5 h-5 text-blue-600" /> {t.p2Title}
                </h2>
                <p className="text-sm text-slate-600">{t.p2Observe}</p>

                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl border border-slate-200 p-4">
                    <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-1.5 rounded-lg font-bold uppercase tracking-wider text-xs mb-3 flex items-center gap-2">
                      <div className="w-2 h-2 rounded-full bg-emerald-500"></div> {t.p2Normal}
                    </div>
                    <div className="overflow-x-auto custom-scrollbar">
                      <div className="flex gap-1 min-w-max pb-1">{renderDnaStrip(current.dna, correctDna, false)}</div>
                    </div>
                  </div>
                  <div className="bg-white rounded-2xl border border-slate-200 p-4">
                    <div className="bg-rose-50 border border-rose-200 text-rose-800 px-3 py-1.5 rounded-lg font-bold uppercase tracking-wider text-xs mb-3 flex items-center gap-2">
                      <div className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div> {t.p2Mutant}
                    </div>
                    <div className="overflow-x-auto custom-scrollbar">
                      <div className="flex gap-1 min-w-max pb-1">{renderDnaStrip(correctDna, current.dna, true)}</div>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border-2 border-blue-200 p-5 space-y-4">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <Icon name="brain" className="w-5 h-5 text-blue-600" /> {t.p2HypTitle}
                  </h3>
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="space-y-2">
                      <label className="text-sm font-semibold block">{t.p2HypQ1}</label>
                      <textarea
                        value={prediction.type}
                        onChange={e => setPrediction(p => ({ ...p, type: e.target.value }))}
                        placeholder={t.p2HypPlaceholder1}
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm min-h-[100px] focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
                      />
                    </div>
                    <div className="space-y-2">
                      <label className="text-sm font-semibold block">{t.p2HypQ2}</label>
                      <textarea
                        value={prediction.effect}
                        onChange={e => setPrediction(p => ({ ...p, effect: e.target.value }))}
                        placeholder={t.p2HypPlaceholder2}
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm min-h-[100px] focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
                      />
                    </div>
                  </div>
                  <div className="flex justify-between pt-2">
                    <Btn onClick={() => setPhase(1)} variant="ghost">{t.back}</Btn>
                    <Btn
                      onClick={() => {
                        if (prediction.type.trim() && prediction.effect.trim()) {
                          setHasPredicted(true);
                          setPhase(3);
                          setScore(s => s + 10);
                        } else {
                          alert(t.p2NeedBoth);
                        }
                      }}
                      variant="success"
                    >
                      {t.p2Confirm} <Icon name="arrow-right" className="w-4 h-4" />
                    </Btn>
                  </div>
                </div>
              </section>
            )}

            {/* ===== PHASE 3: TRANSCRIBE + TRANSLATE ===== */}
            {phase === 3 && (
              <section className="space-y-5">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h2 className="font-bold text-lg flex items-center gap-2">
                    <Icon name="flask-conical" className="w-5 h-5 text-blue-600" /> {t.p3Title}
                  </h2>
                  <div className="flex gap-2">
                    <Btn size="sm" variant="secondary" onClick={() => setShowKey(k => !k)}>
                      <Icon name="book-open" className="w-4 h-4" /> {showKey ? t.p3HideKey : t.p3KeyTitle}
                    </Btn>
                    <Btn size="sm" variant="secondary" onClick={() => setShowCodon(c => !c)}>
                      <Icon name="table" className="w-4 h-4" /> {showCodon ? t.hideCodon : t.codonTable}
                    </Btn>
                  </div>
                </div>

                {showKey && (
                  <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 text-sm text-indigo-900 space-y-1.5">
                    <p className="font-semibold mb-1">{t.p3KeyTitle}</p>
                    <p>1. {t.p3Key1}</p>
                    <p>2. {t.p3Key2}</p>
                    <p>3. {t.p3Key3}</p>
                    <p>4. {t.p3Key4}</p>
                  </div>
                )}

                {showCodon && (
                  <div className="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-0.5 font-mono p-2 bg-slate-900 text-white rounded-2xl">
                    {Object.entries(CODON_TABLE).map(([c, a]) => (
                      <div key={c} className="px-1 py-1 border border-white/10 rounded-md bg-slate-800/50 flex flex-col items-center justify-center leading-tight">
                        <div className="text-blue-300 font-bold text-[11px] sm:text-xs">{c}</div>
                        <div className="text-white/80 text-[10px] sm:text-[11px] truncate w-full text-center">{a}</div>
                      </div>
                    ))}
                  </div>
                )}

                <div className="grid md:grid-cols-2 gap-3">
                  <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-2 rounded-xl font-bold uppercase tracking-wider text-xs flex items-center gap-2">
                    <div className="w-2 h-2 rounded-full bg-emerald-500"></div> {t.p2Normal}
                  </div>
                  <div className="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-2 rounded-xl font-bold uppercase tracking-wider text-xs flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div> {t.p2Mutant}
                    </div>
                    <span className="text-[10px] font-medium normal-case">{t.p3Attempts}: {attempts}</span>
                  </div>
                </div>

                {/* mRNA */}
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 rounded-2xl p-4 text-white">
                    <h3 className="text-sm font-bold mb-3 flex items-center gap-2"><Icon name="refresh-cw" className="w-4 h-4 text-blue-400" /> {t.p3NormalMrna}</h3>
                    <div className="overflow-x-auto custom-scrollbar">
                      <div className="flex gap-1 min-w-max pb-1">
                        {mrnaOriginal.split("").map((b, i) => (
                          <div key={i} className="flex flex-col items-center">
                            <span className="text-[8px] text-slate-500 font-bold mb-0.5">{i + 1}</span>
                            <div className={`w-7 h-9 flex items-center justify-center border-2 rounded-lg text-xs font-bold ${BASE_COLORS[b] || "bg-slate-800"} border-blue-500/30`}>{b}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div className={`rounded-2xl p-4 border transition-all ${isChecking ? (isMrnaCorrect ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200") : "bg-white border-slate-200"}`}>
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-sm font-bold text-slate-800">{t.p3MutantMrna}</h3>
                      {isChecking && (isMrnaCorrect ? <Icon name="check-circle" className="w-5 h-5 text-emerald-500" /> : <Icon name="alert-circle" className="w-5 h-5 text-rose-500" />)}
                    </div>
                    <textarea
                      value={ansMrna}
                      onChange={e => setAnsMrna(e.target.value.toUpperCase().replace(/[^AUGC]/g, ""))}
                      placeholder={t.p3PlaceholderMrna}
                      className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-sm min-h-[60px] focus:outline-none focus:border-blue-400"
                    />
                    {ansMrna && (
                      <div className="mt-2 overflow-x-auto custom-scrollbar">
                        <div className="flex gap-1 min-w-max pb-1">{renderLiveMrna(ansMrna, correctMrna)}</div>
                      </div>
                    )}
                    {isChecking && (
                      <div className={`mt-2 p-2 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-2 ${isMrnaCorrect ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                        {isMrnaCorrect ? t.p3Correct : t.p3Incorrect}
                      </div>
                    )}
                    {showCorrect && !isMrnaCorrect && (
                      <div className="mt-2 p-2 bg-blue-50 border border-blue-200 rounded-lg text-xs font-mono text-blue-900">
                        {t.p3ShowCorrect}: {correctMrna}
                      </div>
                    )}
                  </div>
                </div>

                {/* Protein */}
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-slate-800 rounded-2xl p-4 text-white">
                    <h3 className="text-sm font-bold mb-3">{t.p3NormalProt}</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {proteinOriginal.map((aa, i) => (
                        <div key={i} className="flex flex-col items-center">
                          <div className="px-2.5 py-1.5 bg-slate-900 rounded-lg text-xs font-bold border border-white/10 text-emerald-400">{aa}</div>
                          <span className="text-[8px] text-slate-500 mt-0.5">{mrnaOriginal.substring(i * 3, i * 3 + 3)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className={`rounded-2xl p-4 border transition-all ${isChecking ? (isProteinCorrect ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200") : "bg-white border-slate-200"}`}>
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-sm font-bold text-slate-800">{t.p3MutantProt}</h3>
                      {isChecking && (isProteinCorrect ? <Icon name="check-circle" className="w-5 h-5 text-emerald-500" /> : <Icon name="alert-circle" className="w-5 h-5 text-rose-500" />)}
                    </div>
                    <textarea
                      value={ansProtein}
                      onChange={e => setAnsProtein(e.target.value)}
                      placeholder={t.p3PlaceholderProt}
                      className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm min-h-[60px] focus:outline-none focus:border-blue-400"
                    />
                    {isChecking && (
                      <div className={`mt-2 p-2 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-2 ${isProteinCorrect ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                        {isProteinCorrect ? t.p3Correct : t.p3Incorrect}
                      </div>
                    )}
                    {showCorrect && !isProteinCorrect && (
                      <div className="mt-2 p-2 bg-blue-50 border border-blue-200 rounded-lg text-xs font-mono text-blue-900">
                        {t.p3ShowCorrect}: {correctProteinStr}
                      </div>
                    )}
                  </div>
                </div>

                {(isChecking || ansProtein.length > 5) && (
                  <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2">
                    <h3 className="font-bold text-emerald-800 flex items-center gap-2"><Icon name="beaker" className="w-4 h-4" /> {t.p3AaTitle}</h3>
                    <p className="text-sm text-emerald-700">{t.p3AaHint}</p>
                    <textarea
                      value={aaNote}
                      onChange={e => setAaNote(e.target.value)}
                      placeholder={t.p3AaPlaceholder}
                      className="w-full p-3 bg-white border border-emerald-200 rounded-xl text-sm min-h-[70px] focus:outline-none focus:border-emerald-400"
                    />
                  </div>
                )}

                <div className="flex flex-wrap justify-between gap-2 pt-2">
                  <Btn onClick={() => setPhase(2)} variant="ghost">{t.back}</Btn>
                  <div className="flex gap-2">
                    <Btn onClick={handleCheck} variant="secondary">
                      {isChecking ? t.p3Hide : t.p3Check}
                    </Btn>
                    <Btn onClick={() => setPhase(4)} variant="success" disabled={!hasPredicted}>
                      {t.next} <Icon name="arrow-right" className="w-4 h-4" />
                    </Btn>
                  </div>
                </div>
              </section>
            )}

            {/* ===== PHASE 4: DISCUSSION ===== */}
            {phase === 4 && (
              <section className="space-y-5">
                <h2 className="font-bold text-lg flex items-center gap-2">
                  <Icon name="message-square" className="w-5 h-5 text-blue-600" /> {t.p4Title}
                </h2>

                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-900">
                  <Icon name="info" className="w-4 h-4 inline-block mr-1 align-text-bottom" />
                  {t.lockNote}
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  {[
                    { id: "q1", label: t.p4Q1, hint: t.p4H1 },
                    { id: "q2", label: t.p4Q2, hint: t.p4H2 },
                    { id: "q3", label: t.p4Q3, hint: t.p4H3 },
                    { id: "q4", label: t.p4Q4, hint: t.p4H4 }
                  ].map(q => (
                    <div key={q.id} className="bg-white rounded-2xl border border-slate-200 p-4">
                      <label className="font-semibold text-sm block mb-2">{q.label}</label>
                      <p className="text-xs text-slate-500 mb-2">{q.hint}</p>
                      <textarea
                        value={notes[q.id]}
                        onChange={e => setNotes(n => ({ ...n, [q.id]: e.target.value }))}
                        placeholder={q.hint}
                        readOnly={!!lockedFields[q.id]}
                        className={`w-full border rounded-xl p-3 text-sm min-h-[110px] focus:outline-none ${
                          lockedFields[q.id] ? "border-slate-300 bg-slate-100 text-slate-700 cursor-not-allowed" : "border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
                        }`}
                      />
                      <p className="text-xs text-slate-400 mt-1">{notes[q.id].trim().length} {t.chars}</p>
                    </div>
                  ))}
                </div>

                {(() => {
                  const allAnswered = ["q1","q2","q3","q4"].every(id => notes[id].trim().length >= 20);
                  return (
                    <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 space-y-3">
                      <div className="flex flex-wrap items-center justify-between gap-3">
                        <p className="text-sm text-blue-900 font-medium">
                          {allAnswered
                            ? t.lockNote
                            : (lang === "vi"
                              ? "Hãy hoàn thành cả 4 câu hỏi (ít nhất 20 ký tự/câu) trước khi xem đáp án tham khảo."
                              : "Complete all 4 questions (at least 20 characters each) before viewing the reference answers.")}
                        </p>
                        <Btn
                          size="sm"
                          variant="secondary"
                          disabled={!allAnswered && !Object.keys(lockedFields).some(k => lockedFields[k])}
                          onClick={() => {
                            const currentlyShown = Object.keys(lockedFields).some(k => lockedFields[k]);
                            if (currentlyShown) {
                              setLockedFields({});
                            } else if (allAnswered) {
                              setLockedFields({ q1: true, q2: true, q3: true, q4: true });
                            }
                          }}
                        >
                          <Icon name="eye" className="w-4 h-4" />
                          {Object.keys(lockedFields).some(k => lockedFields[k]) ? t.hideSample : t.showSample}
                        </Btn>
                      </div>

                      {Object.keys(lockedFields).some(k => lockedFields[k]) && (
                        <div className="bg-white border border-blue-200 rounded-xl p-4 space-y-3">
                          <p className="font-semibold text-xs uppercase text-blue-600">{t.sampleAnswer}</p>
                          {["q1","q2","q3","q4"].map(id => (
                            <div key={id} className="text-sm text-blue-900">
                              <p className="font-semibold mb-1">{t[`p4Q${id.slice(1)}`]}</p>
                              <p className="whitespace-pre-line leading-relaxed">{discussionSamples[id]}</p>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })()}

                <div className="flex justify-between pt-2">
                  <Btn onClick={() => setPhase(3)} variant="ghost">{t.back}</Btn>
                  <Btn
                    onClick={() => { setPhase(5); setScore(s => s + 15); }}
                    variant="success"
                    disabled={!["q1","q2","q3","q4"].every(id => notes[id].trim().length >= 20)}
                  >
                    {t.next} <Icon name="arrow-right" className="w-4 h-4" />
                  </Btn>
                </div>
              </section>
            )}

            {/* ===== PHASE 5: REFLECTION ===== */}
            {phase === 5 && (
              <section className="space-y-5">
                <div className="text-center bg-slate-900 text-white rounded-2xl p-6">
                  <p className="text-amber-400 text-xs font-bold uppercase tracking-wider mb-1">{t.p5Complete}</p>
                  <h2 className="text-xl font-extrabold mb-2">{t.p5Title}</h2>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
                  <h3 className="font-bold text-slate-800">{t.p5SummaryTitle}</h3>
                  <p className="text-sm"><span className="font-semibold">{t.p5Case}:</span> {current.disease[lang]} · {current.gene}</p>
                  <p className="text-sm"><span className="font-semibold">{t.p5Hypothesis}:</span> {prediction.type ? `${prediction.type}${prediction.effect ? " | " + prediction.effect : ""}` : "—"}</p>
                  <p className="text-sm"><span className="font-semibold">{t.p5Mrna}:</span> {ansMrna || "—"}</p>
                  <p className="text-sm"><span className="font-semibold">{t.p5Protein}:</span> {ansProtein || "—"}</p>
                  <div className="pt-2 border-t border-slate-100 space-y-2">
                    <p className="text-xs font-bold uppercase tracking-wider text-slate-500">{t.phase4}</p>
                    {[
                      { id: "q1", label: t.p4Q1 },
                      { id: "q2", label: t.p4Q2 },
                      { id: "q3", label: t.p4Q3 },
                      { id: "q4", label: t.p4Q4 }
                    ].map(q => (
                      <div key={q.id} className="text-sm">
                        <p className="font-semibold text-slate-700 mb-0.5">{q.label}</p>
                        <p className="text-slate-600 whitespace-pre-line leading-relaxed bg-slate-50 rounded-lg px-3 py-2 border border-slate-100">
                          {notes[q.id]?.trim() || "—"}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-gradient-to-br from-amber-50 to-emerald-50 border border-amber-200 rounded-2xl p-5 space-y-3">
                  <h3 className="font-semibold text-slate-800 flex items-center gap-2">
                    <Icon name="lightbulb" className="w-5 h-5 text-amber-500" /> {t.p5ReflectTitle}
                  </h3>
                  <WrittenAnswer
                    label=""
                    hint={t.p5ReflectHint}
                    placeholder={t.p5ReflectPlaceholder}
                    value={reflection}
                    onChange={setReflection}
                    minChars={40}
                    rows="min-h-[110px]"
                    sample={t.p5ReflectSample}
                    t={t}
                    locked={!!lockedFields.reflection}
                    onLock={() => lockField("reflection")}
                  />
                </div>

                <div className="flex flex-wrap gap-2 justify-between">
                  <Btn onClick={() => setPhase(4)} variant="ghost">{t.back}</Btn>
                  <div className="flex gap-2">
                    <Btn onClick={fullReset} variant="danger" size="sm">{t.reset}</Btn>
                  </div>
                </div>
              </section>
            )}
          </main>

          <footer className="mt-8 pt-4 border-t border-slate-200 text-center text-xs text-slate-400">
            {t.footer}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
